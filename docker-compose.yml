services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-url_shortener}
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-url_shortener}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-url_shortener}
      PORT: 3000
      # Only matters for something calling the API directly at its own
      # published port (below), bypassing Traefik entirely - traffic
      # routed through Traefik's /api PathPrefix is same-origin with the
      # web app from the browser's point of view and isn't subject to CORS.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
    ports:
      # Optional direct access for debugging/curl - the primary path is
      # through Traefik (see the `traefik` service and this service's labels).
      - "${API_PORT:-3000}:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      # Higher than web's router so /api never falls through to the SPA
      # catch-all - Traefik v3 derives priority from rule length by default,
      # which already favors this longer rule, but it's set explicitly here
      # since routing correctness shouldn't depend on an implicit tie-break.
      - traefik.http.routers.api.priority=10
      - traefik.http.services.api.loadbalancer.server.port=3000

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=PathPrefix(`/`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=80

  # Reverse proxy / single ingress point - routes /api/* to the api service
  # and everything else to the web service's static build, via Docker
  # provider label discovery (see the two services' traefik.* labels above)
  # rather than a hand-written nginx proxy_pass. This is the project's own
  # bundled, standalone Traefik instance for running the stack in isolation
  # (locally, in CI, for a reviewer); it is NOT the same Traefik as the
  # author's homelab's shared instance - see docs/homelab-deployment-notes.md
  # for how this service is swapped out for that shared instance instead.
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - api
      - web

volumes:
  pg-data:
