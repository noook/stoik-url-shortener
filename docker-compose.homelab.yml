# Homelab override — NOT a substitute for docker-compose.yml, an addition
# to it. Use both together via `-f`, never edit docker-compose.yml itself
# for this (that's what causes dirty changes on docker-host):
#
#   docker compose -f docker-compose.yml -f docker-compose.homelab.yml \
#     up -d --build postgres api web
#
# Deliberately omits "traefik" from that service list, not from this file -
# the bundled `traefik` service in docker-compose.yml exists only for
# running the stack in isolation (local dev, CI, a reviewer). The homelab
# has its own shared, always-on Traefik instance that already watches the
# Docker socket and picks up new routers from labels on ANY container on
# its `proxy` network - there's nothing to start for it here.
#
# Matches the shared instance's actual config (see
# docs/homelab-deployment-notes.md):
#   - Single entrypoint named "web" on :80, not "websecure"/:443 - TLS is
#     terminated upstream by the Cloudflare Tunnel pointed at the shared
#     Traefik container, not by Traefik itself. No tls=true label needed
#     (and setting one would be actively wrong - Traefik itself never
#     speaks TLS here).
#   - providers.docker.network is pinned to "proxy" (an external network,
#     not the default one Compose would create) - the shared instance only
#     discovers containers actually joined to that network, regardless of
#     labels. api/web need `networks: [proxy]` below, or Traefik silently
#     never finds them.
#
# Requires HOMELAB_HOSTNAME in .env - see .env.example. The external
# "proxy" network must already exist (it's created once by the shared
# Traefik stack itself, not by this project).
services:
  api:
    networks:
      - default
      - proxy
    environment:
      WEB_ORIGIN: https://${HOMELAB_HOSTNAME:?set HOMELAB_HOSTNAME in .env}
    # Compose merges `labels` lists ACROSS -f files by key, not by replacing
    # the whole list - the base docker-compose.yml's bare `api`/`api-fallback`
    # router labels would otherwise still be present here too, registering
    # BOTH the bare and prefixed names on the shared instance at once
    # (exactly the collision this override exists to avoid). `!override`
    # replaces the merged result outright instead of appending to it - see
    # https://docs.docker.com/reference/compose-file/merge/#override-value.
    labels:
      !override
      - traefik.enable=true
      # Router/service names prefixed with the project slug
      # ("url-shortener-") - the shared instance discovers labels from
      # every project's containers on the same `proxy` network, and
      # Traefik namespaces routers/services by whatever key you give it,
      # not automatically by project/stack. A bare "api" or "web" here
      # would collide with any other project's router/service of the same
      # name (very likely for something this generic), with Traefik
      # silently letting one shadow the other - no startup error.
      - traefik.http.routers.url-shortener-api.rule=Host(`${HOMELAB_HOSTNAME:?set HOMELAB_HOSTNAME in .env}`) && PathPrefix(`/api`)
      - traefik.http.routers.url-shortener-api.entrypoints=web
      - traefik.http.routers.url-shortener-api.priority=10
      - traefik.http.services.url-shortener-api.loadbalancer.server.port=3000
      # See docker-compose.yml's api-fallback router for what this owns
      # (bare root + short codes) - same idea, scoped to this Host() here
      # since the shared instance routes multiple projects off one entrypoint.
      - traefik.http.routers.url-shortener-api-fallback.rule=Host(`${HOMELAB_HOSTNAME:?set HOMELAB_HOSTNAME in .env}`) && PathPrefix(`/`)
      - traefik.http.routers.url-shortener-api-fallback.entrypoints=web
      - traefik.http.routers.url-shortener-api-fallback.priority=1
      - traefik.http.routers.url-shortener-api-fallback.service=url-shortener-api

  web:
    networks:
      - default
      - proxy
    # See the api service's `labels` comment above - same reasoning.
    labels:
      !override
      - traefik.enable=true
      - traefik.http.routers.url-shortener-web.rule=Host(`${HOMELAB_HOSTNAME:?set HOMELAB_HOSTNAME in .env}`) && PathPrefix(`/admin`)
      - traefik.http.routers.url-shortener-web.entrypoints=web
      - traefik.http.routers.url-shortener-web.priority=5
      - traefik.http.services.url-shortener-web.loadbalancer.server.port=80

networks:
  proxy:
    external: true
