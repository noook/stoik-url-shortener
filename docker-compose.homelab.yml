# Homelab override — NOT a substitute for docker-compose.yml, an addition
# to it. Use both together via `-f`, never edit docker-compose.yml itself
# for this (that's what causes dirty changes on docker-host):
#
#   docker compose -f docker-compose.yml -f docker-compose.homelab.yml \
#     up -d --build postgres api web
#
# Deliberately omits "traefik" from that service list, not from this file -
# the bundled `traefik` service in docker-compose.yml exists only for
# running the stack in isolation (local dev, CI, a reviewer). The homelab
# has its own shared, always-on Traefik instance that already watches the
# Docker socket and picks up new routers from labels on ANY container on
# its `proxy` network - there's nothing to start for it here.
#
# Matches the shared instance's actual config (see
# docs/homelab-deployment-notes.md):
#   - Single entrypoint named "web" on :80, not "websecure"/:443 - TLS is
#     terminated upstream by the Cloudflare Tunnel pointed at the shared
#     Traefik container, not by Traefik itself. No tls=true label needed
#     (and setting one would be actively wrong - Traefik itself never
#     speaks TLS here).
#   - providers.docker.network is pinned to "proxy" (an external network,
#     not the default one Compose would create) - the shared instance only
#     discovers containers actually joined to that network, regardless of
#     labels. api/web need `networks: [proxy]` below, or Traefik silently
#     never finds them.
#
# Requires HOMELAB_HOSTNAME in .env - see .env.example. The external
# "proxy" network must already exist (it's created once by the shared
# Traefik stack itself, not by this project).
services:
  api:
    networks:
      - default
      - proxy
    environment:
      WEB_ORIGIN: https://${HOMELAB_HOSTNAME:?set HOMELAB_HOSTNAME in .env}
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`${HOMELAB_HOSTNAME:?set HOMELAB_HOSTNAME in .env}`) && PathPrefix(`/api`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.routers.api.priority=10
      - traefik.http.services.api.loadbalancer.server.port=3000

  web:
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`${HOMELAB_HOSTNAME:?set HOMELAB_HOSTNAME in .env}`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.routers.web.priority=1
      - traefik.http.services.web.loadbalancer.server.port=80

networks:
  proxy:
    external: true
