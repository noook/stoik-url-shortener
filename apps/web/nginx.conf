server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the api container so the browser sees them
    # as same-origin - required for the httpOnly auth cookie to be sent/set
    # without CORS gymnastics. `api` resolves via Docker Compose's default
    # network (the service name in docker-compose.yml).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any non-file route resolves to index.html so React
    # Router's client-side routes (e.g. /links/:id) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
