server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx builds any Location header it constructs itself (redirects,
    # directory-slash-append) as an absolute URL using $scheme by default -
    # and $scheme here is "http", since TLS is terminated upstream by the
    # Cloudflare Tunnel and Traefik forwards plain HTTP to this container
    # (see docs/homelab-deployment-notes.md). Left at the default, a
    # visitor on https:// would get redirected to http://, a silent
    # downgrade. Relative Location headers (path only) are resolved by the
    # browser against whatever origin it actually used, so they can't get
    # this wrong regardless of what scheme nginx itself sees.
    absolute_redirect off;

    # Plain static file server - no reverse-proxy logic here. Routing /api/*
    # to the api container and everything else (bare root, short codes) to
    # the api container's fallback router is Traefik's job (see
    # docker-compose.yml, this service's own traefik.* labels, and the
    # api/api-fallback/web routers' priority ordering).

    # Dashboard is served under /admin (see Dockerfile - the build output
    # physically lives at html/admin/... to match the /admin/assets/...
    # URLs vite's `base` config bakes into index.html). SPA fallback: any
    # non-file route under /admin resolves to admin/index.html so React
    # Router's client-side routes (e.g. /admin/links/:id) work on a hard
    # refresh. Nginx isn't expected to ever receive a bare "/" request -
    # Traefik's web router only forwards this container PathPrefix(`/admin`).
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Explicit redirect for the no-trailing-slash form, kept explicit
    # rather than relying purely on nginx's implicit directory-append
    # behavior for clarity - `absolute_redirect off` above (not this
    # location alone) is what keeps it scheme-safe.
    location = /admin {
        return 301 /admin/;
    }
}
