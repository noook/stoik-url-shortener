server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Plain static file server - no reverse-proxy logic here. Routing /api/*
    # to the api container is Traefik's job (see docker-compose.yml, this
    # service's own traefik.* labels, and PathPrefix(`/api`) vs. PathPrefix(`/`)
    # priority between the api and web routers).

    # SPA fallback: any non-file route resolves to index.html so React
    # Router's client-side routes (e.g. /links/:id) work on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
